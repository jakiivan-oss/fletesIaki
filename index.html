<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fletes Iaki - Calculadora</title>
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Calculadora de fletes para Fletes Iaki" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #171717;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    main {
      background: #fff;
      color: #222;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 900;
      font-size: 1.5rem;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #222;
    }
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    .error-msg {
      color: #b3261e;
      font-weight: 700;
      margin-top: 4px;
      display: none;
    }
    .toggle-container {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #222;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      background-color: #ff6600;
      color: white;
      width: 48%;
    }
    button.btn-reset {
      background-color: #ccc;
      color: #333;
    }
    .btn-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    #resultado {
      margin-top: 20px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #222;
      min-height: 50px;
    }
    /* Logo container */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 250px;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-container">
      <img src="logo.png" alt="Logo Fletes Iaki" />
    </div>
    <h2>Calculadora Fletes Iaki</h2>
    <form id="formulario">
      <label for="distancia">Distancia (km):</label>
      <input type="number" id="distancia" name="distancia" min="0" step="0.1" required />
      <div id="error-distancia" class="error-msg">Por favor ingresa una distancia válida.</div>

      <label for="region">Región:</label>
      <select id="region" name="region" required>
        <option value="gba">Gran Buenos Aires (GBA)</option>
        <option value="caba">Capital Federal (CABA)</option>
      </select>

      <div id="zona-caba-container" style="display:none;">
        <label for="zona-caba">Zona en CABA:</label>
        <select id="zona-caba" name="zona-caba">
          <optgroup label="Zonas complicadas">
            <option value="Microcentro / Once / Congreso">Microcentro / Once / Congreso</option>
            <option value="San Telmo / Retiro / Recoleta">San Telmo / Retiro / Recoleta</option>
            <option value="Palermo / Belgrano / Villa Crespo">Palermo / Belgrano / Villa Crespo</option>
            <option value="Caballito / Almagro / Flores">Caballito / Almagro / Flores</option>
            <option value="Puerto Madero / Ciclovías">Puerto Madero / Ciclovías</option>
          </optgroup>
          <optgroup label="Zonas no complicadas">
            <option value="Villa Devoto / Liniers / Mataderos">Villa Devoto / Liniers / Mataderos</option>
            <option value="Villa Lugano / Villa Soldati / Villa Riachuelo">Villa Lugano / Villa Soldati / Villa Riachuelo</option>
            <option value="Parque Avellaneda / Villa Luro">Parque Avellaneda / Villa Luro</option>
            <option value="Floresta / Vélez Sarsfield">Floresta / Vélez Sarsfield</option>
            <option value="Villa Urquiza / Coghlan / Saavedra">Villa Urquiza / Coghlan / Saavedra</option>
          </optgroup>
        </select>
      </div>

      <div class="toggle-container">
        <input type="checkbox" id="ruta-rapida" name="ruta-rapida" />
        <label for="ruta-rapida">Ruta rápida (Peaje)</label>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-reset" id="btn-reset">Limpiar</button>
        <button type="submit">Calcular</button>
      </div>
    </form>

    <div id="resultado" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById('formulario');
    const distanciaInput = document.getElementById('distancia');
    const regionSelect = document.getElementById('region');
    const zonaCabaContainer = document.getElementById('zona-caba-container');
    const zonaCabaSelect = document.getElementById('zona-caba');
    const rutaRapidaCheckbox = document.getElementById('ruta-rapida');
    const resultadoDiv = document.getElementById('resultado');
    const errorDistanciaDiv = document.getElementById('error-distancia');
    const btnReset = document.getElementById('btn-reset');

    const PEAJE_EXTRA = 1500;

    const zonasComplicadas = [
      "Microcentro / Once / Congreso",
      "San Telmo / Retiro / Recoleta",
      "Palermo / Belgrano / Villa Crespo",
      "Caballito / Almagro / Flores",
      "Puerto Madero / Ciclovías"
    ];

    regionSelect.addEventListener('change', () => {
      if (regionSelect.value === 'caba') {
        zonaCabaContainer.style.display = 'block';
      } else {
        zonaCabaContainer.style.display = 'none';
      }
      resultadoDiv.textContent = '';
      errorDistanciaDiv.style.display = 'none';
    });

    btnReset.addEventListener('click', () => {
      form.reset();
      zonaCabaContainer.style.display = 'none';
      resultadoDiv.textContent = '';
      errorDistanciaDiv.style.display = 'none';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const distancia = parseFloat(distanciaInput.value);
      if (isNaN(distancia) || distancia < 0) {
        errorDistanciaDiv.style.display = 'block';
        resultadoDiv.textContent = '';
        return;
      } else {
        errorDistanciaDiv.style.display = 'none';
      }

      const region = regionSelect.value;
      const rutaRapida = rutaRapidaCheckbox.checked;

      let precio = 0;
      let detalle = '';

      if (region === 'caba') {
        const barrio = zonaCabaSelect.value;
        const esDificil = zonasComplicadas.includes(barrio);
        const valorKm = esDificil ? 1100 : 1000;
        precio = distancia * valorKm;
        detalle = `Región: CABA, Zona: ${esDificil ? 'Complicada' : 'No complicada'}`;
      } else {
        if (distancia <= 8) {
          precio = 0;
          detalle = 'Región: Gran Buenos Aires (GBA) - hasta 8 km gratis';
        } else {
          precio = distancia * 1000;
          detalle = `Región: Gran Buenos Aires (GBA) - cobro total por ${distancia.toFixed(1).replace('.', ',')} km`;
        }
      }

      if (rutaRapida) {
        precio += PEAJE_EXTRA;
        detalle += ', Ruta rápida (Peaje) incluida';
      } else {
        detalle += ', Sin ruta rápida (Peaje)';
      }

      resultadoDiv.textContent = precio === 0 ? 'Gratis' : `Precio estimado: $${precio.toLocaleString('es-AR')} (${detalle})`;
    });
  </script>
</body>
</html>
