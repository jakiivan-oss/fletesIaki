<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fletes Iaki - Calculadora</title>

  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#FF6600" />

  <!-- Manifest para PWA -->
  <link rel="manifest" href="manifest.json" />

  <style>
    /* (Aquí va todo el CSS que te pasé antes, por brevedad no lo repito) */
    /* Puedes copiar el CSS del código anterior aquí */
  </style>
 <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="estilo.css" />

</head>
<body>
  <main class="card" role="main" aria-label="Calculadora de fletes">
    <h2>CALCULADORA</h2>
    <div class="contacto-header" aria-hidden="true">FLETES IAKI</div>
    <p class="info" aria-live="polite">📍 Base: Int. Manuel Quindimil 741, Lanús</p>

    <label for="distancia">Distancia (km):</label>
    <input
      type="number"
      id="distancia"
      name="distancia"
      placeholder="Ej: 10"
      min="0"
      inputmode="decimal"
      aria-describedby="error-distancia"
      required
    />
    <div id="error-distancia" class="error-msg" role="alert" aria-live="assertive">Ingresá una distancia válida.</div>

    <label for="region">Región:</label>
    <select id="region" name="region" onchange="toggleBarrios()" aria-controls="div-barrios" aria-expanded="false">
      <option value="gba">Gran Buenos Aires (GBA)</option>
      <option value="caba">Capital Federal (CABA)</option>
    </select>

    <div id="div-barrios" class="hidden" aria-hidden="true">
      <label for="tipo_zona">Barrio CABA:</label>
      <select id="tipo_zona" name="tipo_zona">
        <optgroup label="Zonas Difíciles">
          <option value="dificil" class="op-dificil">Microcentro / Once / Congreso</option>
          <option value="dificil" class="op-dificil">San Telmo / Retiro / Recoleta</option>
          <option value="dificil" class="op-dificil">Palermo / Belgrano / V. Crespo</option>
          <option value="dificil" class="op-dificil">Caballito / Almagro / Flores</option>
          <option value="dificil" class="op-dificil">Puerto Madero / Ciclovías</option>
        </optgroup>
        <optgroup label="Zonas Fáciles">
          <option value="facil" class="op-facil">V. Devoto / Liniers / Mataderos</option>
          <option value="facil" class="op-facil">Saavedra / Urquiza / Coghlan</option>
          <option value="facil" class="op-facil">P. Patricios / Pompeya / Barracas</option>
          <option value="facil" class="op-facil">V. Lugano / Soldati / Riachuelo</option>
          <option value="facil" class="op-facil">M. Castro / Versalles / Floresta</option>
          <option value="facil" class="op-facil">Otros barrios residenciales</option>
        </optgroup>
      </select>
    </div>

    <div class="toggle-container">
      <label for="ruta_rapida">🚚 Ruta Rápida (Peaje)</label>
      <input type="checkbox" id="ruta_rapida" class="switch" name="ruta_rapida" />
    </div>

    <div class="btn-group">
      <button class="btn-reset" type="button" onclick="reiniciar()">Borrar</button>
      <button class="btn-main" type="button" onclick="calcularFlete()">Calcular</button>
    </div>

    <section id="resultado" aria-live="polite" aria-atomic="true" role="region" tabindex="0"></section>
  </main>

  <script>
    // Mostrar u ocultar barrios según región seleccionada
    function toggleBarrios() {
      const regionSelect = document.getElementById('region');
      const barriosDiv = document.getElementById('div-barrios');
      const expanded = regionSelect.value === 'caba';
      barriosDiv.classList.toggle('hidden', !expanded);
      barriosDiv.setAttribute('aria-hidden', !expanded);
      regionSelect.setAttribute('aria-expanded', expanded);
    }

    // Reiniciar formulario
    function reiniciar() {
      document.getElementById('distancia').value = '';
      document.getElementById('region').value = 'gba';
      toggleBarrios();
      document.getElementById('tipo_zona').selectedIndex = 0;
      document.getElementById('ruta_rapida').checked = false;
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('error-distancia').style.display = 'none';
    }

    // Validar y calcular flete (ejemplo simple)
    function calcularFlete() {
      const distanciaInput = document.getElementById('distancia');
      const errorDistancia = document.getElementById('error-distancia');
      const resultado = document.getElementById('resultado');

      const distancia = parseFloat(distanciaInput.value);
      if (isNaN(distancia) || distancia <= 0) {
        errorDistancia.style.display = 'block';
        resultado.style.display = 'none';
        distanciaInput.focus();
        return;
      } else {
        errorDistancia.style.display = 'none';
      }

      const region = document.getElementById('region').value;
      const tipoZona = document.getElementById('tipo_zona').value;
      const rutaRapida = document.getElementById('ruta_rapida').checked;

      let basePrice = 100;
      let distancePrice = distancia * 10;
      let zoneMultiplier = tipoZona === 'dificil' ? 1.3 : 1.0;
      let tollFee = rutaRapida ? 50 : 0;

      let total = (basePrice + distancePrice) * zoneMultiplier + tollFee;

      resultado.innerHTML = `
        <div class="precio">$${total.toFixed(2)}</div>
        <span class="detalle-texto">Distancia: ${distancia} km</span>
        <span class="detalle-texto">Región: ${region.toUpperCase()}</span>
        <span class="detalle-texto">Zona: ${tipoZona === 'dificil' ? 'Difícil' : 'Fácil'}</span>
        <span class="detalle-texto">Ruta rápida: ${rutaRapida ? 'Sí' : 'No'}</span>
      `;
      resultado.style.display = 'block';
      resultado.focus();
    }

    // Inicializar estado
    document.addEventListener('DOMContentLoaded', () => {
      toggleBarrios();
    });

    // Registrar service worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          console.log('Service Worker registrado con éxito:', registration.scope);
        }).catch(error => {
          console.log('Error al registrar Service Worker:', error);
        });
      });
    }
  </script>
</body>
</html>
