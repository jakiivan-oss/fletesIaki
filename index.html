<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fletes Iaki - Calculadora</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#FF6600">

    <style>
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #1a1a1a; display: flex; justify-content: center; padding: 10px; color: #eee; }
        
        .card { background: white; padding: 18px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-top: 8px solid #FF6600; color: #333; box-sizing: border-box; }
        
        h2 { color: #333; text-align: center; margin-bottom: 2px; font-size: 1.1rem; font-weight: 900; letter-spacing: -1px; }
        .contacto-header { text-align: center; font-size: 0.9rem; color: #FF6600; font-weight: 800; margin-bottom: 10px; }
        .info { font-size: 0.75rem; color: #777; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.75rem; color: #444; }
        
        input, select { 
            width: 100%; 
            padding: 8px; 
            margin-top: 4px; 
            border: 1px solid #eef2f7; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 13px !important; 
            outline: none; 
            background: #f9f9f9;
            color: #333;
            height: 38px;
        }

        /* COLORES PARA LOS BARRIOS */
        .op-dificil { color: #d32f2f !important; font-weight: bold; } /* Rojo */
        .op-facil { color: #1976d2 !important; font-weight: bold; }   /* Azul */
        
        optgroup[label="Zonas Difíciles"] { color: #d32f2f; }
        optgroup[label="Zonas Fáciles"] { color: #1976d2; }

        .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; background: #fff5eb; padding: 10px; border-radius: 10px; border: 1px solid #ffd8b3; }
        .toggle-container label { margin: 0; cursor: pointer; font-size: 0.75rem; color: #c24e00; font-weight: bold; }
        .switch { width: 18px; height: 18px; cursor: pointer; accent-color: #FF6600; }

        .btn-group { display: flex; gap: 8px; margin-top: 20px; }
        button { flex: 2; background-color: #FF6600; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 0.8rem; transition: 0.2s; text-transform: uppercase; box-shadow: 0 3px 0 #cc5200; }
        .btn-reset { flex: 1; background-color: #f1f3f4; color: #5f6368; box-shadow: 0 3px 0 #d1d3d4; }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #cc5200; }
        
        #resultado { margin-top: 20px; padding: 15px; border-radius: 12px; text-align: center; display: none; background-color: #333; color: white; border: 2px solid #FF6600; }
        .precio { font-size: 2rem; font-weight: 900; color: #FF6600; margin: 5px 0; }
        .detalle-texto { font-size: 0.7rem; color: #bbb; text-transform: uppercase; }
        .btn-copy { background-color: #28a745; margin-top: 10px; width: 100%; box-shadow: 0 3px 0 #1e7e34; font-size: 0.75rem; }
        
        .footer-contacto { margin-top: 20px; text-align: center; font-size: 0.75rem; color: #666; border-top: 1px solid #eee; padding-top: 10px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>CALCULADORA</h2>
    <div class="contacto-header">FLETES IAKI</div>
    <p class="info">📍 Base: Int. Manuel Quindimil 741, Lanús</p>

    <label for="distancia">Distancia (km):</label>
    <input type="number" id="distancia" placeholder="Ej: 10" min="0">

    <label for="region">Región:</label>
    <select id="region" onchange="toggleBarrios()">
        <option value="gba">Gran Buenos Aires (GBA)</option>
        <option value="caba">Capital Federal (CABA)</option>
    </select>

    <div id="div-barrios" class="hidden">
        <label for="tipo_zona">Barrio CABA:</label>
        <select id="tipo_zona">
            <optgroup label="Zonas Difíciles">
                <option value="dificil" class="op-dificil">Microcentro / Once / Congreso</option>
                <option value="dificil" class="op-dificil">San Telmo / Retiro / Recoleta</option>
                <option value="dificil" class="op-dificil">Palermo / Belgrano / V. Crespo</option>
                <option value="dificil" class="op-dificil">Caballito / Almagro / Flores</option>
                <option value="dificil" class="op-dificil">Puerto Madero / Ciclovías</option>
            </optgroup>
            <optgroup label="Zonas Fáciles">
                <option value="facil" class="op-facil">V. Devoto / Liniers / Mataderos</option>
                <option value="facil" class="op-facil">Saavedra / Urquiza / Coghlan</option>
                <option value="facil" class="op-facil">P. Patricios / Pompeya / Barracas</option>
                <option value="facil" class="op-facil">V. Lugano / Soldati / Riachuelo</option>
                <option value="facil" class="op-facil">M. Castro / Versalles / Floresta</option>
                <option value="facil" class="op-facil">Otros barrios residenciales</option>
            </optgroup>
        </select>
    </div>

    <div class="toggle-container">
        <label for="ruta_rapida">🚚 Ruta Rápida (Peaje)</label>
        <input type="checkbox" id="ruta_rapida" class="switch">
    </div>

    <div class="btn-group">
        <button class="btn-reset" onclick="reiniciar()">BORRAR</button>
        <button onclick="calcularFlete()">CALCULAR</button>
    </div>

    <div id="resultado">
        <span class="detalle-texto" id="detalle"></span>
        <div class="precio" id="monto"></div>
        <button class="btn-copy" onclick="copiarPresupuesto()">COPIAR Y ENVIAR</button>
    </div>

    <div class="footer-contacto">
        Santiago Ivan Rozman | 📞 11 7136-7889
    </div>
</div>

<script>
    const PRECIO_KM = 1500; 
    const BASE_CABA_FACIL = 3000;
    const BASE_CABA_DIFICIL = 5000;
    const COSTO_PEAJE = 3000;

    function toggleBarrios() {
        const region = document.getElementById('region').value;
        const divBarrios = document.getElementById('div-barrios');
        divBarrios.style.display = (region === 'caba') ? 'block' : 'none';
    }

    function calcularFlete() {
        const km = parseFloat(document.getElementById('distancia').value);
        const region = document.getElementById('region').value;
        const tipoCaba = document.getElementById('tipo_zona').value;
        const rutaRapida = document.getElementById('ruta_rapida').checked;

        if (isNaN(km) || km < 0) { alert("Ingresa los km."); return; }

        let total = 0;
        let desc = "";

        if (region === "gba") {
            if (km <= 10) { total = 0; desc = "GBA - Bonificado"; }
            else { total = (km - 10) * PRECIO_KM; desc = `GBA - ${(km-10)} km excedentes`; }
        } else {
            if (km <= 6) { total = 0; desc = "CABA - Bonificado"; }
            else {
                const excedente = km - 6;
                if (tipoCaba === "facil") {
                    total = BASE_CABA_FACIL + (excedente * PRECIO_KM);
                    desc = `CABA Fácil - Base $${BASE_CABA_FACIL} + ${excedente} km`;
                } else {
                    total = BASE_CABA_DIFICIL + (excedente * PRECIO_KM);
                    desc = `CABA Difícil - Base $${BASE_CABA_DIFICIL} + ${excedente} km`;
                }
            }
        }

        if (rutaRapida && total > 0) { total += COSTO_PEAJE; desc += " + Peaje"; }

        document.getElementById('resultado').style.display = "block";
        document.getElementById('detalle').innerText = desc;
        document.getElementById('monto').innerText = "$" + total.toLocaleString('es-AR');
    }

    function copiarPresupuesto() {
        const desc = document.getElementById('detalle').innerText;
        const monto = document.getElementById('monto').innerText;
        const texto = `*FLETES IAKI*\n🚚 ${desc}\n💰 *TOTAL: ${monto}*\n📞 1171367889`;
        navigator.clipboard.writeText(texto).then(() => alert("¡Presupuesto copiado!"));
    }

    function reiniciar() {
        document.getElementById('distancia').value = "";
        document.getElementById('region').selectedIndex = 0;
        document.getElementById('ruta_rapida').checked = false;
        document.getElementById('div-barrios').style.display = 'none';
        document.getElementById('resultado').style.display = "none";
    }
</script>

</body>
</html>
