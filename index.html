<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-fletes Santiago Ivan Rozman</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #f39c12; --dark: #1a1a1a; --shadow: 0 10px 30px rgba(0,0,0,0.1); }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 480px; background: white; border-radius: 25px; padding: 20px; box-shadow: var(--shadow); position: relative; }
        
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #f8f9fa; padding-bottom: 15px; }
        
        /* Contenedor del Logo Berlingo */
        .logo-container { width: 120px; margin: 0 auto 10px; display: block; }
        
        .header h1 { color: var(--dark); font-size: 1.8rem; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .header p { color: var(--primary); font-weight: 700; margin: 5px 0 0; font-size: 0.9rem; text-transform: uppercase; }
        .ws-text { font-size: 1.1rem; font-weight: 800; color: #25d366; margin-top: 8px; display: block; }

        .card { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #eee; }
        label { display: block; font-size: 0.8rem; font-weight: 800; color: #666; margin-bottom: 8px; text-transform: uppercase; }
        select, input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #ddd; font-size: 0.95rem; outline: none; background: white; }
        
        .info-box { font-size: 0.75rem; color: #444; margin-top: 10px; line-height: 1.5; background: #fffceb; padding: 12px; border-radius: 10px; border-left: 4px solid var(--primary); }
        
        .btn { width: 100%; background: var(--dark); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-reset { background: #f0f2f5; color: #1a1a1a; margin-top: 15px; border: 1px solid #ddd; padding: 12px; font-size: 0.9rem; }
        
        #res { margin-top: 20px; padding: 20px; border-radius: 15px; background: var(--primary); color: white; text-align: center; display: none; animation: slideUp 0.4s ease; }
        #res span { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        #res big { font-size: 2.8rem; display: block; font-weight: 800; margin-top: 5px; }
        .advertencia { font-size: 0.7rem; margin-top: 12px; opacity: 0.95; font-weight: 700; line-height: 1.4; background: rgba(0,0,0,0.1); padding: 10px; border-radius: 8px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <!-- Logo Berlingo Vidriada (SVG) -->
        <div class="logo-container">
            <svg viewBox="0 0 100 50" xmlns="http://w3.org">
                <!-- Cuerpo de la Berlingo -->
                <path d="M5,40 L95,40 L93,25 C92,20 88,15 80,15 L35,15 L25,18 L10,25 Z" fill="#333" />
                <!-- Ventanas (Vidriada) -->
                <rect x="28" y="19" width="15" height="10" rx="2" fill="#87CEEB" opacity="0.6" />
                <rect x="46" y="19" width="20" height="10" rx="2" fill="#87CEEB" opacity="0.6" />
                <rect x="69" y="19" width="18" height="10" rx="2" fill="#87CEEB" opacity="0.6" />
                <!-- Ruedas -->
                <circle cx="20" cy="40" r="6" fill="#1a1a1a" stroke="#fff" stroke-width="2" />
                <circle cx="80" cy="40" r="6" fill="#1a1a1a" stroke="#fff" stroke-width="2" />
                <!-- Detalle Luces -->
                <rect x="92" y="28" width="2" height="5" fill="#ff4444" />
                <rect x="6" y="30" width="3" height="4" fill="#ffffaa" />
            </svg>
        </div>
        <h1>MINI-FLETES</h1>
        <p>Santiago Ivan Rozman</p>
        <span class="ws-text">WhatsApp: 11 7136 7889</span>
    </div>

    <div id="formulario">
        <div class="card">
            <label>1. Área de Cobertura</label>
            <select id="area" onchange="checkArea()">
                <option value="CABA">Capital Federal (CABA)</option>
                <option value="GBA_NORTE">GBA Zona Norte</option>
                <option value="GBA_OESTE">GBA Zona Oeste</option>
                <option value="GBA_SUR">GBA Zona Sur</option>
            </select>
            <div id="info-gba" class="info-box" style="display:none;"></div>
        </div>

        <div id="seccion-caba" class="card">
            <label>2. Tipo de zona en CABA</label>
            <select id="tipo-caba" onchange="updateInfo()">
                <option value="1100">ZONA RESIDENCIAL</option>
                <option value="1200">ZONA CRÍTICA / CENTRO</option>
            </select>
            <div id="lista-barrios" class="info-box"></div>
        </div>

        <div class="card">
            <label>3. Distancia del Viaje (KM)</label>
            <input type="number" id="km" placeholder="Ej: 15" inputmode="numeric">
        </div>

        <button class="btn" onclick="calcular()">COTIZAR AHORA</button>
    </div>

    <div id="res">
        <span>COSTO ESTIMADO</span>
        <big id="total">$ 0</big>
        <div class="advertencia">
            ⚠️ NOTA: El costo no incluye peajes. Los mismos quedan a cargo del cliente al momento del viaje.
        </div>
        <button class="btn btn-reset" onclick="reiniciar()">↺ NUEVA CONSULTA</button>
    </div>
</div>

<script>
    function checkArea() {
        const area = document.getElementById('area').value;
        const cabaSection = document.getElementById('seccion-caba');
        const gbaInfo = document.getElementById('info-gba');

        if (area === "CABA") {
            cabaSection.style.display = "block";
            gbaInfo.style.display = "none";
            updateInfo();
        } else {
            cabaSection.style.display = "none";
            gbaInfo.style.display = "block";
            const textos = {
                'GBA_NORTE': "<b>Zonas:</b> V. López, Olivos, San Isidro, Tigre, Pilar, Escobar.",
                'GBA_OESTE': "<b>Zonas:</b> Ramos Mejía, Haedo, Morón, Castelar, Ituzaingó, Merlo.",
                'GBA_SUR': "<b>Zonas:</b> Avellaneda, Lanús, Lomas, Quilmes, Banfield, Berazategui."
            };
            gbaInfo.innerHTML = textos[area];
        }
    }

    function updateInfo() {
        const tipo = document.getElementById('tipo-caba').value;
        const info = document.getElementById('lista-barrios');
        if (tipo === "1100") {
            info.innerHTML = "<b>Residencial:</b> Palermo, Belgrano, Caballito, Almagro, Villa Urquiza, Devoto, Flores, Villa Crespo, Nuñez, Saavedra, Coghlan, Villa del Parque, Mataderos, Villa Luro, Pueyrredón, Soldati.";
        } else {
            info.innerHTML = "<b>Crítica/Centro:</b> Microcentro, Congreso, Tribunales, San Telmo, Puerto Madero, Retiro, Once, Recoleta, San Cristóbal, La Boca, Barracas, Boedo, Montserrat.";
        }
    }

    function calcular() {
        const km = document.getElementById('km').value;
        if (!km || km <= 0) return alert("Por favor, ingresá los kilómetros.");

        const areaVal = document.getElementById('area').value;
        let tarifa = (areaVal === "CABA") ? document.getElementById('tipo-caba').value : 1000;

        const total = km * tarifa;
        document.getElementById('total').innerText = "$ " + total.toLocaleString('es-AR');
        
        document.getElementById('formulario').style.display = "none";
        document.getElementById('res').style.display = "block";
    }

    function reiniciar() {
        document.getElementById('res').style.display = "none";
        document.getElementById('formulario').style.display = "block";
        document.getElementById('km').value = "";
    }

    checkArea();
</script>

</body>
</html>
